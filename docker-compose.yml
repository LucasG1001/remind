name: remindme

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3333
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    # Sem porta no host: o proxy reverso central (caddy-docker-proxy, stack ../media/proxy)
    # descobre este container pela rede proxy-net via labels e termina o TLS.
    # O Express serve o SPA e a API na mesma porta 3333.
    labels:
      caddy: ${REMINDME_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3333}}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      proxy-net:
      remindme-net:
        aliases:
          - remindme-server

volumes:
  postgres_data:

networks:
  # Rede compartilhada da VPS (criar uma vez: docker network create remindme-net).
  remindme-net:
    external: true
  # Rede compartilhada com o proxy reverso central (Caddy). Criar uma vez:
  #   docker network create proxy-net
  proxy-net:
    external: true
